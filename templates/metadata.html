<title>{{ seo.title }}</title>
<meta name="description" content="{{ seo.description }}">
<link rel="canonical" href="{{ seo.url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="IBIS Srl">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:url" content="{{ seo.url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ seo.title }}">
<meta name="twitter:description" content="{{ seo.description }}">
{% for (code, translation) in languages %}
<link rel="alternate" hreflang="{{ code }}"
      href="{{ seo.base_url }}/{{ code }}/{% if !seo.is_home %}privacy.html{% endif %}">
{% endfor %}
<link rel="alternate" hreflang="x-default" href="{{ seo.base_url }}/{% if !seo.is_home %}en/privacy.html{% endif %}">
