<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173F56">
  {% include "metadata.html" %}
  <script>{{ language_script|safe }}</script>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
	<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/palette.css">
  <link rel="stylesheet" href="assets/style.css">

</head>
<body class="language-choice">
  <main class="choice-main">
    <img class="choice-logo" src="assets/logo-wordmark.svg" alt="IBIS" width="1430" height="1040">
    <h1>{% for (code, texts) in languages %}<span lang="{{ code }}">{{ texts.chooser_title }}</span>{% endfor %}</h1>
    {% for (code, texts) in languages %}<p lang="{{ code }}">{{ texts.chooser_intro }}</p>{% endfor %}
    <ul class="choice-links" role="list">
      {% for (code, texts) in languages %}
      <li><a href="{{ code }}/index.html" lang="{{ code }}" hreflang="{{ code }}">{{ texts.language_name }} <span aria-hidden="true">↗</span></a></li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
