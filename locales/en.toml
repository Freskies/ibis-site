[[policy.sections]]
title = "Controller and contact details"
text = "This website presents IBIS Srl. The address published on the company’s website is Viale Francesco Baracca 89, 48121 Ravenna (RA), Italy. Personal data enquiries can be sent to Isabel@ibissrl.it."

[[policy.sections]]
title = "Cookies and tracking tools"
text = "This version consists of static pages: it sets no cookies and uses no localStorage, analytics, advertising pixels or embedded third-party content. The entry page reads the language preferences exposed by the browser and opens the first available version in the preferred order; English is used if none match. Selection happens in the browser and is neither stored nor sent to external services. Standard links always allow manual language changes. This function uses no cookies, sessionStorage or other persistent storage."

[[policy.sections]]
title = "Browsing and server logs"
text = "The website is intended to be hosted on a server managed by the website provider and served using Caddy. Server requests transmit connection data such as an IP address and technical browser information. The absence of cookies and tracking does not mean that technical logs are absent."

[[policy.sections]]
title = "Email and telephone"
text = "Email and telephone links open the visitor’s email or phone application. The website has no data collection forms. Information voluntarily sent to IBIS will be used to handle the enquiry."

[[policy.sections]]
title = "Your rights"
text = "Where applicable under Regulation (EU) 2016/679, you may request access, rectification, erasure, restriction, portability and object to processing, and withdraw any consent. You can use the contact above and lodge a complaint with the Italian Data Protection Authority."



