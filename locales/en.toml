[policy]
title = "Privacy and cookie policy"
description = "This notice describes the processing of personal data when browsing the IBIS Srl website and when sending requests to the contacts listed."
intro = "This notice describes the processing of personal data when browsing the IBIS Srl website and when sending requests to the contacts listed."

[[policy.sections]]
title = "Data controller"
text = "The data controller is IBIS Srl, with its registered office at Viale Baracca 89, 48121 Ravenna (RA), Italy, VAT and tax identification number 01286410392.\n\nFor information about the processing of personal data and to exercise your rights, you may write to Isabel@ibissrl.it or to the certified email (PEC) address ibissrl@mypec.eu."

[[policy.sections]]
title = "Browsing and security"
text = "Browsing involves the transmission of technical data necessary for the connection, including your IP address, the resources requested and information provided by your browser.\n\nThese data are processed to make pages available and ensure the operation and security of the website. The legal basis is IBIS’s legitimate interest in providing and protecting the service, pursuant to Article 6(1)(f) of Regulation (EU) 2016/679.\n\nSystematic recording of page visits is not enabled. The infrastructure may generate technical logs relating to operation, errors and security, which may contain personal data. The retention system for these logs is configured for 30 days, with automatic deletion through file rotation.\n\nTransmission of the data necessary for the connection is essential to access the website."

[[policy.sections]]
title = "Cookies and language preferences"
text = "The website does not use cookies, traffic analytics tools, advertising pixels or other tracking and profiling tools. It does not use localStorage or sessionStorage and does not embed third-party content.\n\nThe home page reads the browser’s language preferences to open the first available version in the specified order. If there is no match, the English version opens.\n\nThis selection takes place in the browser, without storing the preference or using external services. You can always change language using the links on the website."

[[policy.sections]]
title = "Contact requests"
text = "The website does not contain data collection forms. Email and telephone links open the visitor’s applications and allow direct contact with IBIS.\n\nData provided voluntarily, such as your name, contact details and the content of your request, are used to respond and manage the related communications.\n\nProcessing is based on:\n\n- taking steps at the data subject’s request prior to entering into a contract, for requests intended to establish a contractual relationship, pursuant to Article 6(1)(b) of the Regulation;\n- IBIS’s legitimate interest in managing correspondence and responding to other requests, pursuant to Article 6(1)(f) of the Regulation.\n\nProviding data is optional. Failure to provide the necessary information may prevent us from responding to your request.\n\nSimple enquiries that do not lead to a contractual relationship are deleted during an annual review, at least 12 months after their conclusion and in any event within 24 months of their conclusion. Conclusion means the last communication that resolves the request, with no further action required.\n\nCorrespondence documenting a contractual relationship is instead subject to the retention periods applicable to that relationship and any legal obligations. In the event of disputes, relevant data may be retained to manage them and protect rights until the dispute and any resulting obligations have been resolved."

[[policy.sections]]
title = "Data recipients and hosting"
text = "Data may be processed by authorised IBIS personnel and providers of services necessary for the operation of the website and management of communications, including hosting, technical support and email.\n\nProviders processing data on behalf of IBIS operate under the agreements required by Article 28 of the Regulation. Data may also be disclosed to the competent authorities where required by law.\n\nThe website is hosted by Hetzner on a server located in Finland. No transfers of personal data outside the European Economic Area are envisaged for the processing described in this notice.\n\nPersonal data are not made publicly available."

[[policy.sections]]
title = "Data subject rights"
text = "Where provided for by Regulation (EU) 2016/679, you may request access to your data, rectification, erasure, restriction of processing and data portability.\n\nYou may also object to processing based on legitimate interest on grounds relating to your particular situation.\n\nRequests may be sent to Isabel@ibissrl.it or to the certified email (PEC) address ibissrl@mypec.eu.\n\nYou may lodge a complaint with the Italian Data Protection Authority (Garante per la protezione dei dati personali) using the procedures described at www.garanteprivacy.it.\n\nNo profiling or decisions based solely on automated processing that produce legal or similarly significant effects on the data subject are carried out."
