[policy]
title = "Politique de confidentialité et de cookies"
description = "La présente notice décrit le traitement des données personnelles lors de la navigation sur le site d’IBIS Srl et des demandes envoyées aux coordonnées indiquées."
intro = "La présente notice décrit le traitement des données personnelles lors de la navigation sur le site d’IBIS Srl et des demandes envoyées aux coordonnées indiquées."

[[policy.sections]]
title = "Responsable du traitement"
text = "Le responsable du traitement est IBIS Srl, dont le siège social est situé Viale Baracca 89, 48121 Ravenna (RA), Italie, numéro de TVA et code fiscal 01286410392.\n\nPour toute information sur le traitement des données personnelles et pour exercer vos droits, vous pouvez écrire à Isabel@ibissrl.it ou à l’adresse de courrier électronique certifié (PEC) ibissrl@mypec.eu."

[[policy.sections]]
title = "Navigation et sécurité"
text = "La navigation implique la transmission des données techniques nécessaires à la connexion, notamment l’adresse IP, les ressources demandées et les informations communiquées par le navigateur.\n\nCes données sont traitées pour rendre les pages accessibles et assurer le fonctionnement et la sécurité du site. La base juridique est l’intérêt légitime d’IBIS à fournir et à protéger le service, conformément à l’article 6, paragraphe 1, point f), du règlement (UE) 2016/679.\n\nL’enregistrement systématique des visites de pages n’est pas activé. L’infrastructure peut générer des journaux techniques relatifs au fonctionnement, aux erreurs et à la sécurité, susceptibles de contenir des données personnelles. Le système de conservation de ces journaux est configuré sur 30 jours, avec suppression automatique par rotation des fichiers.\n\nLa transmission des données nécessaires à la connexion est indispensable pour consulter le site."

[[policy.sections]]
title = "Cookies et préférences linguistiques"
text = "Le site n’utilise ni cookies, ni outils d’analyse du trafic, ni pixels publicitaires, ni autres outils de suivi et de profilage. Il n’utilise pas localStorage ou sessionStorage et n’intègre aucun contenu tiers.\n\nLa page d’accueil lit les préférences linguistiques du navigateur pour ouvrir la première version disponible dans l’ordre indiqué. En l’absence de correspondance, la version anglaise est ouverte.\n\nCette sélection s’effectue dans le navigateur, sans enregistrer la préférence ni utiliser de services externes. Il est toujours possible de changer de langue grâce aux liens du site."

[[policy.sections]]
title = "Demandes de contact"
text = "Le site ne contient aucun formulaire de collecte de données. Les liens de courrier électronique et de téléphone ouvrent les applications du visiteur et permettent de contacter directement IBIS.\n\nLes données communiquées volontairement, telles que le nom, les coordonnées et le contenu de la demande, sont utilisées pour répondre et gérer les communications correspondantes.\n\nLe traitement repose sur :\n\n- l’exécution de mesures précontractuelles prises à la demande de la personne concernée, pour les demandes visant à établir une relation contractuelle, conformément à l’article 6, paragraphe 1, point b), du règlement ;\n- l’intérêt légitime d’IBIS à gérer la correspondance et à répondre aux autres demandes, conformément à l’article 6, paragraphe 1, point f), du règlement.\n\nLa fourniture des données est facultative. L’absence des informations nécessaires peut empêcher de répondre à la demande.\n\nLes simples demandes d’information ne donnant pas lieu à une relation contractuelle sont supprimées lors d’un examen annuel, au moins 12 mois après leur clôture et, en tout état de cause, dans les 24 mois suivant celle-ci. La clôture désigne la dernière communication qui règle la demande, sans autre action à effectuer.\n\nLa correspondance constituant la documentation d’une relation contractuelle suit les délais de conservation applicables à cette relation et les éventuelles obligations légales. En cas de litige, les données pertinentes peuvent être conservées pour sa gestion et la défense des droits, jusqu’au règlement du litige et à l’accomplissement des éventuelles obligations qui en découlent."

[[policy.sections]]
title = "Destinataires des données et hébergement"
text = "Les données peuvent être traitées par les personnes autorisées d’IBIS et les prestataires des services nécessaires au fonctionnement du site et à la gestion des communications, notamment l’hébergement, l’assistance technique et le courrier électronique.\n\nLes prestataires traitant des données pour le compte d’IBIS interviennent sur la base des accords prévus à l’article 28 du règlement. Les données peuvent également être communiquées aux autorités compétentes lorsque la loi le prévoit.\n\nLe site est hébergé chez Hetzner, sur un serveur situé en Finlande. Aucun transfert de données personnelles hors de l’Espace économique européen n’est prévu pour les traitements décrits dans la présente notice.\n\nLes données personnelles ne sont pas rendues publiques."

[[policy.sections]]
title = "Droits de la personne concernée"
text = "Dans les cas prévus par le règlement (UE) 2016/679, vous pouvez demander l’accès à vos données, leur rectification, leur effacement, la limitation du traitement et la portabilité.\n\nVous pouvez également vous opposer aux traitements fondés sur l’intérêt légitime pour des raisons tenant à votre situation particulière.\n\nLes demandes peuvent être envoyées à Isabel@ibissrl.it ou à l’adresse de courrier électronique certifié (PEC) ibissrl@mypec.eu.\n\nVous pouvez introduire une réclamation auprès de l’autorité italienne de protection des données (Garante per la protezione dei dati personali), selon les modalités indiquées sur www.garanteprivacy.it.\n\nAucun profilage ni aucune décision fondée exclusivement sur un traitement automatisé produisant des effets juridiques ou affectant de manière significative et similaire la personne concernée ne sont effectués."
