[[policy.sections]]
title = "Responsable du traitement et contacts"
text = "Ce site présente IBIS Srl. L’adresse publiée sur le site de l’entreprise est Viale Francesco Baracca 89, 48121 Ravenna (RA), Italie. Pour toute demande concernant les données personnelles, vous pouvez écrire à Isabel@ibissrl.it."

[[policy.sections]]
title = "Cookies et outils de suivi"
text = "Cette version se compose de pages statiques : elle ne dépose aucun cookie et n’utilise ni localStorage, ni outils d’analyse, ni pixels publicitaires, ni contenus intégrés de tiers. La page d’entrée lit les préférences linguistiques du navigateur et ouvre la première version disponible dans l’ordre indiqué ; à défaut de correspondance, elle ouvre la version anglaise. Ce choix s’effectue dans le navigateur et n’est ni enregistré ni transmis à des services externes. Des liens permettent toujours de changer de langue manuellement. Cette fonction n’utilise ni cookies, ni sessionStorage, ni aucune autre forme de stockage persistant."

[[policy.sections]]
title = "Navigation et journaux du serveur"
text = "Le site est destiné à être hébergé sur un serveur géré par le prestataire du site et servi avec Caddy. Les requêtes au serveur transmettent des données de connexion, telles que l’adresse IP et des informations techniques sur le navigateur. L’absence de cookies et de suivi ne signifie pas l’absence de journaux techniques."

[[policy.sections]]
title = "Courriel et téléphone"
text = "Les liens de courriel et de téléphone ouvrent l’application de messagerie ou de téléphonie du visiteur. Le site ne comporte aucun formulaire de collecte de données. Les informations transmises volontairement à IBIS seront utilisées pour traiter la demande."

[[policy.sections]]
title = "Vos droits"
text = "Dans les cas prévus par le règlement (UE) 2016/679, vous pouvez demander l’accès, la rectification, l’effacement, la limitation et la portabilité des données, vous opposer au traitement et retirer tout consentement donné. Vous pouvez utiliser le contact indiqué ci-dessus et introduire une réclamation auprès de l’autorité italienne de protection des données."
