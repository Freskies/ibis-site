[[services]]
title = "Análisis y estrategia"
text = "Identificamos los mercados extranjeros más prometedores para sus productos. Mediante estudios de mercado específicos, analizamos la competencia, los precios y las tendencias y definimos una estrategia comercial eficaz para entrar en el mercado objetivo."

[[services]]
title = "Desarrollo comercial"
text = "Buscamos y contactamos directamente con compradores, distribuidores y mayoristas cualificados. Gestionamos la negociación comercial hasta el cierre del acuerdo y el establecimiento de alianzas sólidas y duraderas."

[[services]]
title = "Presencia sobre el terreno"
text = "Participamos en las principales ferias internacionales para crear nuevas redes de contactos y aprovechar oportunidades de negocio. Organizamos viajes y encuentros B2B, tanto en el extranjero con los clientes como en Italia en las instalaciones de nuestros proveedores."

[[services]]
title = "Gestión operativa integral"
text = "Ofrecemos apoyo integral en los ámbitos administrativo, operativo y logístico. Coordinamos las ventas y el marketing con la producción y la logística, simplificando todo el proceso de exportación."

