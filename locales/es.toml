[policy]
title = "Política de privacidad y cookies"
description = "Este aviso describe el tratamiento de datos personales durante la navegación por el sitio web de IBIS Srl y con motivo de las solicitudes enviadas a los contactos indicados."
intro = "Este aviso describe el tratamiento de datos personales durante la navegación por el sitio web de IBIS Srl y con motivo de las solicitudes enviadas a los contactos indicados."

[[policy.sections]]
title = "Responsable del tratamiento"
text = "El responsable del tratamiento es IBIS Srl, con domicilio social en Viale Baracca 89, 48121 Ravenna (RA), Italia, número de IVA y código fiscal 01286410392.\n\nPara obtener información sobre el tratamiento de datos personales y ejercer sus derechos, puede escribir a Isabel@ibissrl.it o a la dirección de correo electrónico certificado (PEC) ibissrl@mypec.eu."

[[policy.sections]]
title = "Navegación y seguridad"
text = "La navegación implica la transmisión de los datos técnicos necesarios para la conexión, entre ellos la dirección IP, los recursos solicitados y la información comunicada por el navegador.\n\nEstos datos se tratan para poner las páginas a disposición del usuario y garantizar el funcionamiento y la seguridad del sitio. La base jurídica es el interés legítimo de IBIS en prestar y proteger el servicio, conforme al artículo 6, apartado 1, letra f), del Reglamento (UE) 2016/679.\n\nNo está activo el registro sistemático de visitas a las páginas. La infraestructura puede generar registros técnicos relativos al funcionamiento, los errores y la seguridad, que pueden contener datos personales. El sistema de conservación de dichos registros está configurado para 30 días, con eliminación automática mediante la rotación de archivos.\n\nLa transmisión de los datos necesarios para la conexión es indispensable para consultar el sitio."

[[policy.sections]]
title = "Cookies y preferencias lingüísticas"
text = "El sitio no utiliza cookies, herramientas de análisis del tráfico, píxeles publicitarios ni otras herramientas de seguimiento y elaboración de perfiles. No utiliza localStorage ni sessionStorage y no incorpora contenidos de terceros.\n\nLa página inicial lee las preferencias lingüísticas del navegador para abrir la primera versión disponible en el orden indicado. Si no hay coincidencias, se abre la versión inglesa.\n\nEsta selección se realiza en el navegador, sin almacenar la preferencia ni utilizar servicios externos. Siempre es posible cambiar de idioma mediante los enlaces del sitio."

[[policy.sections]]
title = "Solicitudes de contacto"
text = "El sitio no contiene formularios de recogida de datos. Los enlaces de correo electrónico y teléfono abren las aplicaciones del visitante y permiten contactar directamente con IBIS.\n\nLos datos comunicados voluntariamente, como el nombre, los datos de contacto y el contenido de la solicitud, se utilizan para responder y gestionar las comunicaciones correspondientes.\n\nEl tratamiento se basa en:\n\n- la aplicación de medidas precontractuales a petición del interesado, para las solicitudes destinadas a establecer una relación contractual, conforme al artículo 6, apartado 1, letra b), del Reglamento;\n- el interés legítimo de IBIS en gestionar la correspondencia y responder a las demás solicitudes, conforme al artículo 6, apartado 1, letra f), del Reglamento.\n\nLa aportación de datos es voluntaria. La falta de la información necesaria puede impedir responder a la solicitud.\n\nLas simples consultas informativas que no den lugar a una relación contractual se eliminan durante una revisión anual, una vez transcurridos al menos 12 meses desde su conclusión y, en todo caso, dentro de los 24 meses siguientes a la conclusión. Se entiende por conclusión la última comunicación que resuelve la solicitud, sin más actuaciones pendientes.\n\nLa correspondencia que documente una relación contractual se rige por los plazos de conservación aplicables a dicha relación y las posibles obligaciones legales. En caso de litigio, los datos pertinentes pueden conservarse para su gestión y la defensa de los derechos, hasta la resolución del litigio y el cumplimiento de las posibles obligaciones resultantes."

[[policy.sections]]
title = "Destinatarios de los datos y alojamiento"
text = "Los datos pueden ser tratados por las personas autorizadas de IBIS y por los proveedores de los servicios necesarios para el funcionamiento del sitio y la gestión de las comunicaciones, incluidos el alojamiento, la asistencia técnica y el correo electrónico.\n\nLos proveedores que tratan datos por cuenta de IBIS actúan conforme a los acuerdos previstos en el artículo 28 del Reglamento. Los datos también podrán comunicarse a las autoridades competentes cuando lo establezca la ley.\n\nEl sitio está alojado en Hetzner, en un servidor situado en Finlandia. Para los tratamientos descritos en este aviso no se prevén transferencias de datos personales fuera del Espacio Económico Europeo.\n\nLos datos personales no se difunden públicamente."

[[policy.sections]]
title = "Derechos del interesado"
text = "En los casos previstos en el Reglamento (UE) 2016/679, puede solicitar el acceso a sus datos, la rectificación, la supresión, la limitación del tratamiento y la portabilidad.\n\nTambién puede oponerse a los tratamientos basados en el interés legítimo por motivos relacionados con su situación particular.\n\nLas solicitudes pueden enviarse a Isabel@ibissrl.it o a la dirección de correo electrónico certificado (PEC) ibissrl@mypec.eu.\n\nPuede presentar una reclamación ante la autoridad italiana de protección de datos (Garante per la protezione dei dati personali), mediante los procedimientos indicados en www.garanteprivacy.it.\n\nNo se realizan actividades de elaboración de perfiles ni decisiones basadas únicamente en tratamientos automatizados que produzcan efectos jurídicos o efectos similares significativamente relevantes para el interesado."
