[policy]
description = "Información sobre privacidad, contactos y funcionamiento sin cookies ni seguimiento del sitio de IBIS Srl."
title = "Política de cookies y privacidad"
intro = "Información sobre el sitio de IBIS Srl y los contactos disponibles."

[[policy.sections]]
title = "Responsable del tratamiento y contactos"
text = "Este sitio presenta a IBIS Srl. La dirección publicada en el sitio de la empresa es Viale Francesco Baracca 89, 48121 Ravenna (RA), Italia. Las consultas sobre datos personales pueden enviarse a Isabel@ibissrl.it."

[[policy.sections]]
title = "Cookies y herramientas de seguimiento"
text = "Esta versión está compuesta por páginas estáticas: no instala cookies ni utiliza localStorage, herramientas de análisis, píxeles publicitarios o contenidos incrustados de terceros. La página de entrada lee las preferencias de idioma del navegador y abre la primera versión disponible en el orden indicado; si no hay coincidencias, abre la versión inglesa. Esta elección se realiza en el navegador y no se guarda ni se envía a servicios externos. Los enlaces permiten cambiar de idioma manualmente en cualquier momento. Esta función no utiliza cookies, sessionStorage ni ninguna otra forma de almacenamiento persistente."

[[policy.sections]]
title = "Navegación y registros del servidor"
text = "El sitio está previsto para alojarse en un servidor gestionado por el proveedor del sitio y servirse mediante Caddy. Las solicitudes al servidor transmiten datos de conexión, como la dirección IP e información técnica del navegador. La ausencia de cookies y seguimiento no implica la ausencia de registros técnicos."

[[policy.sections]]
title = "Correo electrónico y teléfono"
text = "Los enlaces de correo electrónico y teléfono abren la aplicación de correo o de teléfono del visitante. El sitio no contiene formularios de recogida de datos. La información enviada voluntariamente a IBIS se utilizará para atender la consulta."

[[policy.sections]]
title = "Sus derechos"
text = "En los casos previstos por el Reglamento (UE) 2016/679, puede solicitar el acceso, la rectificación, la supresión, la limitación y la portabilidad de los datos, oponerse al tratamiento y retirar cualquier consentimiento otorgado. Puede utilizar el contacto indicado arriba y presentar una reclamación ante la autoridad italiana de protección de datos."
