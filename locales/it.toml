[policy]
title = "Privacy e cookie policy"
description = "Questa informativa descrive il trattamento dei dati personali durante la navigazione sul sito di IBIS Srl e in occasione delle richieste inviate ai contatti indicati."
intro = "Questa informativa descrive il trattamento dei dati personali durante la navigazione sul sito di IBIS Srl e in occasione delle richieste inviate ai contatti indicati."

[[policy.sections]]
title = "Titolare del trattamento"
text = "Il titolare del trattamento è IBIS Srl, con sede legale in Viale Baracca 89, 48121 Ravenna (RA), Italia, P. IVA e C.F. 01286410392.\n\nPer informazioni sul trattamento dei dati personali e per esercitare i propri diritti è possibile scrivere a Isabel@ibissrl.it oppure alla PEC ibissrl@mypec.eu."

[[policy.sections]]
title = "Navigazione e sicurezza"
text = "La navigazione comporta la trasmissione dei dati tecnici necessari alla connessione, tra cui l’indirizzo IP, le risorse richieste e le informazioni comunicate dal browser.\n\nQuesti dati sono trattati per rendere disponibili le pagine e garantire il funzionamento e la sicurezza del sito. La base giuridica è il legittimo interesse di IBIS a fornire e proteggere il servizio, ai sensi dell’art. 6, par. 1, lett. f), del Regolamento (UE) 2016/679.\n\nNon è attiva la registrazione sistematica delle visite alle pagine. L’infrastruttura può generare log tecnici relativi al funzionamento, agli errori e alla sicurezza, che possono contenere dati personali. Il sistema di conservazione di tali log è configurato su 30 giorni, con cancellazione automatica attraverso la rotazione dei file.\n\nLa trasmissione dei dati necessari alla connessione è indispensabile per consultare il sito."

[[policy.sections]]
title = "Cookie e preferenze linguistiche"
text = "Il sito non utilizza cookie, strumenti di analisi del traffico, pixel pubblicitari o altri strumenti di tracciamento e profilazione. Non utilizza localStorage o sessionStorage e non incorpora contenuti di terze parti.\n\nLa pagina iniziale legge le preferenze linguistiche del browser per aprire la prima versione disponibile nell’ordine indicato. In assenza di corrispondenze viene aperta la versione inglese.\n\nQuesta selezione avviene nel browser, senza memorizzare la preferenza e senza utilizzare servizi esterni. È sempre possibile cambiare lingua attraverso i collegamenti presenti sul sito."

[[policy.sections]]
title = "Richieste di contatto"
text = "Il sito non contiene moduli di raccolta dati. I collegamenti email e telefono aprono le applicazioni del visitatore e permettono di contattare direttamente IBIS.\n\nI dati comunicati volontariamente, come nome, recapito e contenuto della richiesta, sono utilizzati per rispondere e gestire le relative comunicazioni.\n\nIl trattamento si basa:\n\n- sull’esecuzione di misure precontrattuali richieste dall’interessato, per le richieste finalizzate a instaurare un rapporto contrattuale, ai sensi dell’art. 6, par. 1, lett. b), del Regolamento;\n- sul legittimo interesse di IBIS a gestire la corrispondenza e rispondere alle altre richieste, ai sensi dell’art. 6, par. 1, lett. f), del Regolamento.\n\nIl conferimento dei dati è facoltativo. La mancata comunicazione delle informazioni necessarie può impedire di rispondere alla richiesta.\n\nLe semplici richieste informative che non danno luogo a un rapporto contrattuale vengono eliminate durante una revisione annuale, una volta trascorsi almeno 12 mesi dalla loro conclusione e comunque entro 24 mesi dalla conclusione. Per conclusione si intende l’ultima comunicazione che definisce la richiesta, senza ulteriori attività da svolgere.\n\nLa corrispondenza che costituisce documentazione di un rapporto contrattuale segue invece i termini di conservazione applicabili a tale rapporto e gli eventuali obblighi di legge. In caso di controversie, i dati pertinenti possono essere conservati per la loro gestione e la tutela dei diritti, fino alla definizione della controversia e degli eventuali adempimenti conseguenti."

[[policy.sections]]
title = "Destinatari dei dati e hosting"
text = "I dati possono essere trattati dai soggetti autorizzati di IBIS e dai fornitori dei servizi necessari al funzionamento del sito e alla gestione delle comunicazioni, tra cui hosting, assistenza tecnica e posta elettronica.\n\nI fornitori che trattano dati per conto di IBIS operano sulla base degli accordi previsti dall’art. 28 del Regolamento. I dati possono inoltre essere comunicati alle autorità competenti quando previsto dalla legge.\n\nIl sito è ospitato presso Hetzner, su un server situato in Finlandia. Per i trattamenti descritti nella presente informativa non sono previsti trasferimenti di dati personali al di fuori dello Spazio economico europeo.\n\nI dati personali non vengono diffusi."

[[policy.sections]]
title = "Diritti dell’interessato"
text = "Nei casi previsti dal Regolamento (UE) 2016/679, è possibile chiedere l’accesso ai propri dati, la rettifica, la cancellazione, la limitazione del trattamento e la portabilità.\n\nÈ inoltre possibile opporsi ai trattamenti basati sul legittimo interesse per motivi connessi alla propria situazione particolare.\n\nLe richieste possono essere inviate a Isabel@ibissrl.it oppure alla PEC ibissrl@mypec.eu.\n\nÈ possibile proporre reclamo al Garante per la protezione dei dati personali, attraverso le modalità indicate sul sito www.garanteprivacy.it.\n\nNon vengono effettuate attività di profilazione né decisioni basate unicamente su trattamenti automatizzati che producano effetti giuridici o analogamente significativi sull’interessato."
