[policy]
description = "Informazioni sulla privacy, sui contatti e sul funzionamento senza cookie o tracciamento del sito IBIS Srl."
title = "Cookie e privacy policy"
intro = "Informazioni sul sito IBIS Srl e sui contatti disponibili."

[[policy.sections]]
title = "Titolare e contatti"
text = "Il sito presenta IBIS Srl. L’indirizzo pubblicato sul sito aziendale è Viale Francesco Baracca 89, 48121 Ravenna (RA), Italia. Per richieste relative ai dati personali è disponibile il contatto Isabel@ibissrl.it."

[[policy.sections]]
title = "Cookie e strumenti di tracciamento"
text = "Questa versione del sito è composta da pagine statiche: non imposta cookie, non usa localStorage, strumenti di analisi, pixel pubblicitari o contenuti incorporati di terze parti. La pagina iniziale legge le preferenze linguistiche esposte dal browser per aprire la prima versione disponibile nell’ordine indicato; in assenza di corrispondenze viene aperta la versione inglese. Questa scelta avviene nel browser e non viene memorizzata né inviata a servizi esterni. I collegamenti consentono sempre di cambiare lingua manualmente. Non sono utilizzati cookie, sessionStorage o altre forme di memoria persistente per questa funzione."

[[policy.sections]]
title = "Navigazione e log del server"
text = "Il sito è destinato a essere ospitato su un server gestito dal fornitore del sito e servito tramite Caddy. Le richieste al server comportano la trasmissione dei dati necessari alla connessione, come indirizzo IP e informazioni tecniche del browser. L’assenza di cookie e tracciamento non implica l’assenza di log tecnici."

[[policy.sections]]
title = "Email e telefono"
text = "I link email e telefono aprono il programma di posta o l’applicazione telefonica del visitatore. Il sito non contiene moduli di raccolta dati. I dati comunicati volontariamente a IBIS saranno utilizzati per gestire la richiesta."

[[policy.sections]]
title = "Diritti"
text = "Nei casi previsti dal Regolamento (UE) 2016/679 è possibile chiedere accesso, rettifica, cancellazione, limitazione, portabilità e opposizione al trattamento, e revocare l’eventuale consenso. È possibile rivolgersi al contatto sopra indicato e proporre reclamo al Garante per la protezione dei dati personali."



