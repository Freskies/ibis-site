[policy]
title = "Política de privacidade e cookies"
description = "Esta informação descreve o tratamento de dados pessoais durante a navegação no sítio da IBIS Srl e no âmbito dos pedidos enviados para os contactos indicados."
intro = "Esta informação descreve o tratamento de dados pessoais durante a navegação no sítio da IBIS Srl e no âmbito dos pedidos enviados para os contactos indicados."

[[policy.sections]]
title = "Responsável pelo tratamento"
text = "O responsável pelo tratamento é a IBIS Srl, com sede social em Viale Baracca 89, 48121 Ravenna (RA), Itália, número de IVA e código fiscal 01286410392.\n\nPara obter informações sobre o tratamento de dados pessoais e exercer os seus direitos, pode escrever para Isabel@ibissrl.it ou para o endereço de correio eletrónico certificado (PEC) ibissrl@mypec.eu."

[[policy.sections]]
title = "Navegação e segurança"
text = "A navegação implica a transmissão dos dados técnicos necessários à ligação, incluindo o endereço IP, os recursos solicitados e as informações comunicadas pelo navegador.\n\nEstes dados são tratados para disponibilizar as páginas e garantir o funcionamento e a segurança do sítio. A base jurídica é o interesse legítimo da IBIS em fornecer e proteger o serviço, nos termos do artigo 6.º, n.º 1, alínea f), do Regulamento (UE) 2016/679.\n\nNão está ativo o registo sistemático das visitas às páginas. A infraestrutura pode gerar registos técnicos relativos ao funcionamento, a erros e à segurança, que podem conter dados pessoais. O sistema de conservação destes registos está configurado para 30 dias, com eliminação automática através da rotação dos ficheiros.\n\nA transmissão dos dados necessários à ligação é indispensável para consultar o sítio."

[[policy.sections]]
title = "Cookies e preferências linguísticas"
text = "O sítio não utiliza cookies, ferramentas de análise de tráfego, píxeis publicitários ou outras ferramentas de rastreamento e definição de perfis. Não utiliza localStorage ou sessionStorage nem incorpora conteúdos de terceiros.\n\nA página inicial lê as preferências linguísticas do navegador para abrir a primeira versão disponível pela ordem indicada. Na ausência de correspondências, é aberta a versão inglesa.\n\nEsta seleção ocorre no navegador, sem guardar a preferência e sem utilizar serviços externos. É sempre possível mudar de idioma através das ligações presentes no sítio."

[[policy.sections]]
title = "Pedidos de contacto"
text = "O sítio não contém formulários de recolha de dados. As ligações de correio eletrónico e telefone abrem as aplicações do visitante e permitem contactar diretamente a IBIS.\n\nOs dados comunicados voluntariamente, como o nome, os contactos e o conteúdo do pedido, são utilizados para responder e gerir as comunicações correspondentes.\n\nO tratamento baseia-se:\n\n- na execução de diligências pré-contratuais a pedido do titular dos dados, para pedidos destinados a estabelecer uma relação contratual, nos termos do artigo 6.º, n.º 1, alínea b), do Regulamento;\n- no interesse legítimo da IBIS em gerir a correspondência e responder aos restantes pedidos, nos termos do artigo 6.º, n.º 1, alínea f), do Regulamento.\n\nO fornecimento dos dados é facultativo. A falta das informações necessárias pode impedir a resposta ao pedido.\n\nOs simples pedidos de informação que não resultem numa relação contratual são eliminados durante uma revisão anual, após decorridos pelo menos 12 meses desde a sua conclusão e, em qualquer caso, no prazo de 24 meses após a conclusão. Entende-se por conclusão a última comunicação que resolve o pedido, sem outras atividades a realizar.\n\nA correspondência que documente uma relação contratual segue os prazos de conservação aplicáveis a essa relação e as eventuais obrigações legais. Em caso de litígio, os dados pertinentes podem ser conservados para a sua gestão e defesa de direitos, até à resolução do litígio e ao cumprimento das eventuais obrigações subsequentes."

[[policy.sections]]
title = "Destinatários dos dados e alojamento"
text = "Os dados podem ser tratados pelas pessoas autorizadas da IBIS e pelos fornecedores dos serviços necessários ao funcionamento do sítio e à gestão das comunicações, incluindo alojamento, assistência técnica e correio eletrónico.\n\nOs fornecedores que tratam dados por conta da IBIS atuam com base nos acordos previstos no artigo 28.º do Regulamento. Os dados podem também ser comunicados às autoridades competentes quando previsto na lei.\n\nO sítio está alojado na Hetzner, num servidor situado na Finlândia. Para os tratamentos descritos nesta informação, não estão previstas transferências de dados pessoais para fora do Espaço Económico Europeu.\n\nOs dados pessoais não são divulgados ao público."

[[policy.sections]]
title = "Direitos do titular dos dados"
text = "Nos casos previstos no Regulamento (UE) 2016/679, pode solicitar o acesso aos seus dados, a retificação, o apagamento, a limitação do tratamento e a portabilidade.\n\nPode ainda opor-se aos tratamentos baseados no interesse legítimo por motivos relacionados com a sua situação particular.\n\nOs pedidos podem ser enviados para Isabel@ibissrl.it ou para o endereço de correio eletrónico certificado (PEC) ibissrl@mypec.eu.\n\nPode apresentar uma reclamação à autoridade italiana de proteção de dados (Garante per la protezione dei dati personali), através dos procedimentos indicados em www.garanteprivacy.it.\n\nNão são realizadas atividades de definição de perfis nem decisões baseadas exclusivamente em tratamentos automatizados que produzam efeitos jurídicos ou efeitos similarmente significativos sobre o titular dos dados."
