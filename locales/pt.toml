[policy]
description = "Informações sobre privacidade, contactos e funcionamento sem cookies nem rastreamento do site da IBIS Srl."
title = "Política de cookies e privacidade"
intro = "Informações sobre o site da IBIS Srl e os contactos disponíveis."

[[policy.sections]]
title = "Responsável pelo tratamento e contactos"
text = "Este site apresenta a IBIS Srl. A morada publicada no site da empresa é Viale Francesco Baracca 89, 48121 Ravenna (RA), Itália. Os pedidos relativos a dados pessoais podem ser enviados para Isabel@ibissrl.it."

[[policy.sections]]
title = "Cookies e ferramentas de rastreamento"
text = "Esta versão é composta por páginas estáticas: não define cookies nem utiliza localStorage, ferramentas de análise, píxeis publicitários ou conteúdos incorporados de terceiros. A página de entrada lê as preferências de idioma do navegador e abre a primeira versão disponível na ordem indicada; se não houver correspondência, abre a versão inglesa. Esta escolha ocorre no navegador e não é guardada nem enviada a serviços externos. Os links permitem sempre mudar de idioma manualmente. Esta função não utiliza cookies, sessionStorage ou qualquer outra forma de armazenamento persistente."

[[policy.sections]]
title = "Navegação e registos do servidor"
text = "O site destina-se a ser alojado num servidor gerido pelo prestador do site e servido através do Caddy. Os pedidos ao servidor transmitem dados de ligação, como o endereço IP e informações técnicas do navegador. A ausência de cookies e rastreamento não significa que não existam registos técnicos."

[[policy.sections]]
title = "Correio eletrónico e telefone"
text = "Os links de correio eletrónico e telefone abrem a aplicação de email ou de telefone do visitante. O site não tem formulários de recolha de dados. As informações enviadas voluntariamente à IBIS serão utilizadas para tratar o pedido."

[[policy.sections]]
title = "Os seus direitos"
text = "Nos casos previstos no Regulamento (UE) 2016/679, pode solicitar o acesso, a retificação, o apagamento, a limitação e a portabilidade dos dados, opor-se ao tratamento e retirar qualquer consentimento dado. Pode utilizar o contacto acima e apresentar uma reclamação à autoridade italiana de proteção de dados."
